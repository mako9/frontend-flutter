# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # lib/gen_l10n/ is generated from lib/l10n/*.arb and is gitignored, and neither `flutter analyze` nor
      # `flutter test` runs the generator: without this step the checkout has no AppLocalizations at all and
      # analysis reports 162 errors, 27 test files fail to compile. Measured on 2026-11-23 with the directory
      # deleted; `flutter gen-l10n` recreates it byte-for-byte.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      # flutter analyze, not dart analyze: it applies the Flutter-specific lints from analysis_options.yaml
      # that `dart analyze` does not.
      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
